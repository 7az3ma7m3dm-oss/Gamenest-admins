<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameNest — Admin Login</title>
  <style>
    body { background: #000; color: #fff; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .login-box { background: #0a0a0a; border: 1px solid rgba(255,255,255,0.2); padding: 30px; width: 320px; box-sizing: border-box; }
    h2 { font-size: 1.2rem; text-transform: uppercase; margin-bottom: 20px; font-family: monospace; }
    input { width: 100%; padding: 12px; margin: 10px 0; background: #000; border: 1px solid #444; color: #fff; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #fff; color: #000; font-weight: bold; border: none; cursor: pointer; margin-top: 10px; }
    button:hover { background: #ccc; }
    .error { color: #ff4444; font-size: 0.85rem; margin-top: 10px; display: none; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>GameNest // Restricted</h2>
    <form id="loginForm">
      <input type="text" id="username" placeholder="Admin Username" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Authenticate</button>
      <div id="errorMsg" class="error"></div>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('errorMsg');
      errorDiv.style.display = 'none';

      try {
        const response = await fetch('http://localhost:5000/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Login failed');

        // Store secure token and redirect to dashboard
        localStorage.setItem('adminToken', data.token);
        window.location.href = 'dashboard.html';
      } catch (err) {
        errorDiv.textContent = err.message;
        errorDiv.style.display = 'block';
      }
    });
  </script>
</body>
</html>
