<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameNest — Admin Dashboard</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { background: #000; color: #fff; font-family: 'Inter', sans-serif; margin: 0; padding: 40px; }
    .header-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 15px; }
    h1 { font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; font-size: 1.8rem; margin: 0; }
    .logout-btn { background: transparent; border: 1px solid #fff; color: #fff; padding: 8px 15px; cursor: pointer; font-family: monospace; }
    .logout-btn:hover { background: #fff; color: #000; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-top: 30px; }
    .card { background: #0a0a0a; border: 1px solid rgba(255,255,255,0.2); padding: 20px; }
    .card h3 { font-family: 'IBM Plex Mono', monospace; color: #888; font-size: 0.8rem; margin: 0 0 10px; text-transform: uppercase; }
    .card .val { font-family: 'IBM Plex Mono', monospace; font-size: 2rem; font-weight: 600; }
  </style>
</head>
<body>
  <div class="header-row">
    <h1>GameNest // Owner Dashboard</h1>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>

  <div class="grid">
    <div class="card">
      <h3>Pending Tickets</h3>
      <div class="val" id="pendingCount">--</div>
    </div>
    <div class="card">
      <h3>Total Revenue (EGP)</h3>
      <div class="val" id="totalRevenue">--</div>
    </div>
    <div class="card">
      <h3>Active Products</h3>
      <div class="val" id="activeProductsCount">--</div>
    </div>
  </div>

  <script>
    async function loadDashboard() {
      const token = localStorage.getItem('adminToken');
      if (!token) {
        window.location.href = 'login.html';
        return;
      }

      try {
        const response = await fetch('http://localhost:5000/api/admin/overview', {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!response.ok) throw new Error('Unauthorized');

        const data = await response.json();
        document.getElementById('pendingCount').textContent = data.pendingTickets;
        document.getElementById('totalRevenue').textContent = Number(data.totalRevenueEGP).toLocaleString();
        document.getElementById('activeProductsCount').textContent = data.activeProductsCount;
      } catch (err) {
        localStorage.removeItem('adminToken');
        window.location.href = 'login.html';
      }
    }

    function logout() {
      localStorage.removeItem('adminToken');
      window.location.href = 'login.html';
    }

    loadDashboard();
  </script>
</body>
</html>
